name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_RELEASES_REPO: ${{ vars.PUBLIC_RELEASES_REPO || 'ali111887/AuroraPad-Releases' }}
  PUBLIC_RELEASES_TARGET: ${{ vars.PUBLIC_RELEASES_TARGET || 'main' }}

jobs:
  metadata:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.actor != 'github-actions[bot]' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      windows_signed: ${{ steps.signing.outputs.windows_signed }}
      mac_signed: ${{ steps.signing.outputs.mac_signed }}
      gpg_enabled: ${{ steps.signing.outputs.gpg_enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Calculate semantic release version
        id: version
        run: |
          node scripts/resolve-release-version.js >> "$GITHUB_OUTPUT"

      - name: Detect signing availability
        id: signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -n "$WIN_CSC_LINK" && -n "$WIN_CSC_KEY_PASSWORD" ]]; then
            echo "windows_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            echo "mac_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac_signed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$GPG_PRIVATE_KEY" && -n "$GPG_PASSPHRASE" ]]; then
            echo "gpg_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "gpg_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            command: npm run electron:build:win
          - name: linux
            os: ubuntu-latest
            command: npm run electron:build:linux
          - name: mac
            os: macos-latest
            command: npm run electron:build:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w node-pty-prebuilt-multiarch keytar

      - name: Run security scan
        run: npm run security:scan

      - name: Prepare platform signing mode
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          case "${{ matrix.name }}" in
            windows)
              if [[ -z "$WIN_CSC_LINK" || -z "$WIN_CSC_KEY_PASSWORD" ]]; then
                echo "Windows signing secrets missing. Building unsigned Windows artifacts."
              else
                echo "Windows signing enabled."
              fi
              ;;
            mac)
              if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
                echo "macOS signing or notarization secrets missing. Skipping macOS public release build."
                exit 0
              else
                echo "macOS signing enabled."
              fi
              ;;
            linux)
              ;;
          esac

      - name: Apply release version
        run: npm run version:set -- ${{ needs.metadata.outputs.version }}
        if: ${{ matrix.name != 'mac' || needs.metadata.outputs.mac_signed == 'true' }}

      - name: Log build signing mode
        if: ${{ matrix.name != 'mac' || needs.metadata.outputs.mac_signed == 'true' }}
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            windows)
              if [[ "${{ needs.metadata.outputs.windows_signed }}" == "true" ]]; then
                echo "Windows build mode: signed"
              else
                echo "Windows build mode: unsigned"
              fi
              ;;
            mac)
              if [[ "${{ needs.metadata.outputs.mac_signed }}" == "true" ]]; then
                echo "macOS build mode: signed-and-notarized"
              else
                echo "macOS build mode: skipped"
              fi
              ;;
            linux)
              echo "Linux build mode: unsigned package + checksum release"
              ;;
          esac

      - name: Build packaged app
        run: ${{ matrix.command }}
        if: ${{ matrix.name != 'mac' || needs.metadata.outputs.mac_signed == 'true' }}
        env:
          WIN_CSC_LINK: ${{ needs.metadata.outputs.windows_signed == 'true' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ needs.metadata.outputs.windows_signed == 'true' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ needs.metadata.outputs.mac_signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.metadata.outputs.mac_signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ needs.metadata.outputs.mac_signed == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.metadata.outputs.mac_signed == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.metadata.outputs.mac_signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.name == 'windows' && needs.metadata.outputs.windows_signed != 'true' && 'false' || (matrix.name == 'linux' && 'false' || '') }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.name != 'mac' || needs.metadata.outputs.mac_signed == 'true' }}
        with:
          name: release-${{ needs.metadata.outputs.version }}-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

  publish:
    name: Publish Public GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Create and push release tag
        env:
          TAG_NAME: ${{ needs.metadata.outputs.tag }}
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "$TAG_NAME"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Validate public release settings
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "${PUBLIC_RELEASES_TOKEN}" ]]; then
            echo "PUBLIC_RELEASES_TOKEN is not configured."
            echo "Create a fine-grained token for the public releases repository and store it as a secret."
            exit 1
          fi

      - name: Import GPG key
        if: ${{ needs.metadata.outputs.gpg_enabled == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode > /tmp/aurorapad-signing.key
          gpg --batch --import /tmp/aurorapad-signing.key
          rm -f /tmp/aurorapad-signing.key

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          TAG_NAME="${{ needs.metadata.outputs.tag }}"
          VERSION="${{ needs.metadata.outputs.version }}"
          TARGET_REPO="${PUBLIC_RELEASES_REPO}"
          TARGET_REF="${PUBLIC_RELEASES_TARGET}"

          if gh release view "$TAG_NAME" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Immutable releases prevent modifying assets after publish, so skipping upload."
            exit 0
          fi

          repo_info="$(gh api "repos/${TARGET_REPO}")"
          target_default_branch="$(printf '%s' "$repo_info" | jq -r '.default_branch // empty')"
          repo_is_empty="$(printf '%s' "$repo_info" | jq -r 'if (.size == 0 or .pushed_at == null) then "true" else "false" end')"
          if [[ "$repo_is_empty" == "true" ]]; then
            echo "Public releases repository is empty. Bootstrapping ${TARGET_REPO} with branch ${TARGET_REF}."
            bootstrap_dir="$(mktemp -d)"
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "$bootstrap_dir"
            pushd "$bootstrap_dir" >/dev/null
            git checkout --orphan "$TARGET_REF"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf '# AuroraPad Releases\n\nPublic download repository for AuroraPad packaged builds.\n' > README.md
            git add README.md
            git commit -m "chore: initialize public releases repository"
            git push origin "$TARGET_REF"
            popd >/dev/null
            rm -rf "$bootstrap_dir"
          else
            TARGET_REF="$target_default_branch"
          fi

          staging_dir="$(mktemp -d)"
          notes_file="$(mktemp)"
          declare -A seen
          declare -A platform_downloads

          rename_asset() {
            local platform="$1"
            local name="$2"

            case "$platform::$name" in
              windows::AuroraPad\ Setup\ *.exe)
                echo "AuroraPad-${VERSION}-windows-setup.exe"
                ;;
              windows::AuroraPad\ Setup\ *.exe.blockmap)
                echo "AuroraPad-${VERSION}-windows-setup.exe.blockmap"
                ;;
              windows::AuroraPad\ *.exe)
                echo "AuroraPad-${VERSION}-windows-portable.exe"
                ;;
              windows::latest.yml)
                echo "AuroraPad-${VERSION}-windows-latest.yml"
                ;;
              windows::app-update.yml)
                echo "AuroraPad-${VERSION}-windows-app-update.yml"
                ;;
              mac::AuroraPad-*.dmg)
                echo "AuroraPad-${VERSION}-macos-arm64.dmg"
                ;;
              mac::AuroraPad-*.dmg.blockmap)
                echo "AuroraPad-${VERSION}-macos-arm64.dmg.blockmap"
                ;;
              mac::AuroraPad-*-mac.zip)
                echo "AuroraPad-${VERSION}-macos-arm64.zip"
                ;;
              mac::AuroraPad-*-mac.zip.blockmap)
                echo "AuroraPad-${VERSION}-macos-arm64.zip.blockmap"
                ;;
              mac::latest-mac.yml)
                echo "AuroraPad-${VERSION}-macos-latest.yml"
                ;;
              mac::app-update.yml)
                echo "AuroraPad-${VERSION}-macos-app-update.yml"
                ;;
              linux::AuroraPad-*.AppImage)
                echo "AuroraPad-${VERSION}-linux-x64.AppImage"
                ;;
              linux::aurorapad-*.tar.gz)
                echo "AuroraPad-${VERSION}-linux-x64.tar.gz"
                ;;
              linux::latest-linux.yml)
                echo "AuroraPad-${VERSION}-linux-latest.yml"
                ;;
              linux::app-update.yml)
                echo "AuroraPad-${VERSION}-linux-app-update.yml"
                ;;
              *)
                echo "$name"
                ;;
            esac
          }

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            parent_dir="$(basename "$(dirname "$file")")"
            suffix="${parent_dir#release-${VERSION}-}"
            platform="$suffix"

            case "$name" in
              builder-debug.yml)
                echo "Skipping non-release artifact: $name"
                continue
                ;;
            esac

            target_name="$(rename_asset "$platform" "$name")"
            if [[ -n "${seen[$target_name]}" ]]; then
              extension=""
              base_name="$target_name"
              if [[ "$target_name" == *.tar.gz ]]; then
                extension=".tar.gz"
                base_name="${target_name%.tar.gz}"
              elif [[ "$target_name" == *.* ]]; then
                extension=".${target_name##*.}"
                base_name="${target_name%.*}"
              fi

              counter=2
              while [[ -n "${seen[$target_name]}" ]]; do
                target_name="${base_name}-${counter}${extension}"
                counter=$((counter + 1))
              done

              echo "Renaming colliding asset: $name -> $target_name"
            fi

            seen[$target_name]=1
            cp "$file" "$staging_dir/$target_name"

            case "$platform::$target_name" in
              windows::*-windows-setup.exe|windows::*-windows-portable.exe)
                platform_downloads[windows]="$target_name"
                ;;
              mac::*-macos-arm64.dmg|mac::*-macos-arm64.zip)
                if [[ -z "${platform_downloads[mac]:-}" || "$target_name" == *.dmg ]]; then
                  platform_downloads[mac]="$target_name"
                fi
                ;;
              linux::*-linux-x64.AppImage|linux::*-linux-x64.tar.gz)
                if [[ -z "${platform_downloads[linux]:-}" || "$target_name" == *.AppImage ]]; then
                  platform_downloads[linux]="$target_name"
                fi
                ;;
            esac
          done < <(find release-artifacts -type f -print0)

          mapfile -d '' files < <(find "$staging_dir" -maxdepth 1 -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          (
            cd "$staging_dir"
            shasum -a 256 * > SHA256SUMS.txt
          )

          if [[ "${{ needs.metadata.outputs.gpg_enabled }}" == "true" ]]; then
            (
              cd "$staging_dir"
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign \
                --output SHA256SUMS.txt.asc \
                SHA256SUMS.txt
            )
          fi

          mapfile -d '' files < <(find "$staging_dir" -maxdepth 1 -type f -print0)

          {
            echo "## Downloads"
            echo
            if [[ -n "${platform_downloads[windows]:-}" ]]; then
              echo "- Windows: https://github.com/${TARGET_REPO}/releases/download/${TAG_NAME}/${platform_downloads[windows]}"
            fi
            if [[ -n "${platform_downloads[mac]:-}" ]]; then
              echo "- macOS: https://github.com/${TARGET_REPO}/releases/download/${TAG_NAME}/${platform_downloads[mac]}"
            else
              echo "- macOS: not published in this release because Apple signing/notarization is not configured."
            fi
            if [[ -n "${platform_downloads[linux]:-}" ]]; then
              echo "- Linux: https://github.com/${TARGET_REPO}/releases/download/${TAG_NAME}/${platform_downloads[linux]}"
            fi
            echo
            echo "## Notes"
            echo
            echo "Source repository: https://github.com/${GITHUB_REPOSITORY}"
            echo "Public downloads repository: https://github.com/${TARGET_REPO}"
            echo
            echo "Binary downloads are listed first. GitHub may still show source archives automatically, but the platform installers and packages above are the intended downloads."
            if [[ "${{ needs.metadata.outputs.windows_signed }}" != "true" ]]; then
              echo
              echo "Windows artifacts in this release are unsigned and may trigger SmartScreen warnings."
            fi
            echo
            echo "## Verification"
            echo
            echo "- Checksums: SHA256SUMS.txt"
            if [[ "${{ needs.metadata.outputs.gpg_enabled }}" == "true" ]]; then
              echo "- Signature: SHA256SUMS.txt.asc"
            else
              echo "- Signature: not included because GPG signing is not configured."
            fi
          } > "$notes_file"

          gh release create "$TAG_NAME" \
            --repo "$TARGET_REPO" \
            --target "$TARGET_REF" \
            --title "AuroraPad $VERSION" \
            --notes-file "$notes_file" \
            "${files[@]}"

  persist-version:
    name: Persist Released Version
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
      - publish
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.actor != 'github-actions[bot]' && needs.metadata.result == 'success' && needs.build.result == 'success' && needs.publish.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: npm

      - name: Apply released version to repository
        run: npm run version:set -- ${{ needs.metadata.outputs.version }}

      - name: Commit version update
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Repository version is already $VERSION."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): persist version $VERSION [skip ci]"
          git push origin "HEAD:$BRANCH_NAME"
