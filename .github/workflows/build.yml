name: Build Artifacts

on:
  pull_request:
  workflow_dispatch:

jobs:
  metadata:
    name: Resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read package version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply build version
        run: npm run version:set -- ${{ needs.metadata.outputs.version }}

      - name: Build Windows artifacts
        run: npm run electron:build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurorapad-${{ needs.metadata.outputs.version }}-windows
          path: |
            release/**/*.exe
            release/**/*.zip
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: warn

  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply build version
        run: npm run version:set -- ${{ needs.metadata.outputs.version }}

      - name: Build Linux artifacts
        run: npm run electron:build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurorapad-${{ needs.metadata.outputs.version }}-linux
          path: |
            release/**/*.AppImage
            release/**/*.tar.gz
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: warn

  build-mac:
    name: macOS Build
    runs-on: macos-latest
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply build version
        run: npm run version:set -- ${{ needs.metadata.outputs.version }}

      - name: Build macOS artifacts
        run: npm run electron:build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurorapad-${{ needs.metadata.outputs.version }}-mac
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: warn
